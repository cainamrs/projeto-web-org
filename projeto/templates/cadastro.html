{% extends 'base.html' %}

{% block titulo %}Cadastro{% endblock %}

{% block conteudo %}
    <section class="sobre">
        <div>
            <p class="etiqueta">Antes de comprar</p>
            <h1>Crie seu cadastro</h1>
            <p>Informe seu nome e o ano de nascimento. Compras são permitidas apenas para maiores de 18 anos.</p>

            {% if erro %}
                <p class="alerta">{{ erro }}</p>
            {% endif %}

            <form id="form-cadastro" class="card form">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex.: Maria Silva" required>
                </div>
                <div class="campo">
                    <label for="ano">Ano de nascimento</label>
                    <input type="number" id="ano" name="ano" min="1900" max="2100" placeholder="Ex.: 2000" required>
                </div>
                <button type="submit" class="btn">Verificar cadastro</button>
            </form>
        </div>
        <img src="{{ url_for('static', filename='imgs/moletom-cinza.svg') }}" alt="Moletom cinza">
    </section>
{% endblock %}
